<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Travel Jordan</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="main-header">
    <a class="brand-logo" href="/search">
      <div class="logo-emblem"><i class="fa-solid fa-archway"></i></div>
      <span>Travel Jordan</span>
    </a>

    <nav class="nav-menu" id="nav-menu">
      <a class="nav-link" href="/search">Search</a>
      <a class="nav-link active" href="/profile">Profile</a>
      <button class="btn-logout-nav" onclick="logoutUser()">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <div class="page-view">
      <h1 class="section-title">My Information</h1>
      <div class="user-info-card">
        <div class="user-avatar-circle"><i class="fa-solid fa-user"></i></div>
        <div class="user-details">
          <h2 id="user-display-name" style="margin:0; font-size:1.25rem; font-weight:700; color:var(--text-dark, #1e293b);">Traveler</h2>
          <p id="user-display-email">user@example.com</p>
        </div>
      </div>

      <h2 class="section-title">My Favorite Places</h2>
      <div class="cards-grid" id="favorites-container">
        <!-- Dynamic Favorites Loaded via JS -->
      </div>
    </div>
  </main>

  <script>
    async function checkAuthAndLoadUserInfo() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.logged_in) {
          window.location.href = '/login';
          return;
        }
        document.getElementById('user-display-name').textContent = data.user.name;
        document.getElementById('user-display-email').textContent = data.user.email;
      } catch (err) {
        console.error(err);
      }
    }

    async function logoutUser() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    async function loadFavorites() {
      try {
        const res = await fetch('/api/favorites');
        const favs = await res.json();
        const container = document.getElementById('favorites-container');

        if (!favs || favs.length === 0 || favs.message) {
          container.innerHTML = `
            <div class="empty-fav-state" style="grid-column: 1/-1;">
              <div class="empty-fav-icon"><i class="fa-solid fa-heart"></i></div>
              <p>You can add places to your favorites from the search page.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = favs.map(p => `
          <div class="place-card-item">
            <div class="card-img-holder">
              <img src="${p.image_url}" alt="${p.name}">
              <button class="favorite-toggle-btn active" onclick="removeFav(${p.id})">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
            <div class="card-body-content">
              <div>
                <div class="card-item-name">${p.name}</div>
                <div class="card-item-loc">${p.location}</div>
                <span class="card-item-badge">${p.type}</span>
              </div>
              <div class="card-item-rating">
                <i class="fa-solid fa-star"></i> ${p.rating}
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Load favs error:", err);
      }
    }

    async function removeFav(placeId) {
      try {
        const res = await fetch('/api/favorites/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ place_id: placeId })
        });
        const data = await res.json();
        if (data.success) {
          loadFavorites();
        }
      } catch (err) {
        console.error(err);
      }
    }

    // Initialize page
    checkAuthAndLoadUserInfo();
    loadFavorites();
  </script>
</body>
</html>
